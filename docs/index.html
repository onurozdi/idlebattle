<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08192c">
  <title>Soundings — Playtest</title>
  <link rel="stylesheet" href="game.css">
  <script type="module" src="game.js?v=2"></script>
</head>
<body>
  <main id="game" aria-label="Soundings">
    <canvas id="world" width="1080" height="500" aria-label="Game world"></canvas>
    <header id="hud">
      <strong id="location">Open Seas</strong>
      <span id="balance">$540</span>
      <span class="status">Fatigue <meter id="fatigue" max="100" value="0"></meter></span>
      <span class="status">Hunger <meter id="hunger" max="100" value="0"></meter></span>
      <button id="stats">Stats</button><button id="inventory">Inventory</button><button id="menu">Settings</button>
    </header>
    <div id="gauges"></div>
    <div id="context" aria-label="Nearby actions"></div>
    <output id="notice" role="status"></output>
    <div id="movement">
      <div id="stick" aria-label="Steer"><div id="knob"></div></div>
      <div id="dpad" hidden>
        <button data-input="up" aria-label="Up">▲</button><button data-input="left" aria-label="Left">◀</button>
        <button data-input="right" aria-label="Right">▶</button><button data-input="down" aria-label="Down">▼</button>
      </div>
    </div>
    <div id="actions">
      <button id="utility" data-input="utility" aria-label="Utility"></button>
      <button id="jump" data-input="jump" aria-label="Jump"></button>
      <button id="action" data-input="action" aria-label="Interact"></button>
    </div>
    <div id="overlay" hidden>
      <section id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" tabindex="-1">
        <div class="panel-head"><h1 id="panel-title"></h1><button id="close" aria-label="Close">×</button></div>
        <div id="panel-body"></div>
      </section>
    </div>
  </main>
</body>
</html>
